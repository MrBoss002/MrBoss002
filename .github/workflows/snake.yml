name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-readme-activity-graph
    steps:
      - uses: actions/checkout@v3
      - uses: Ashutosh00710/github-readme-activity-graph@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: dist/activity-graph.svg
          theme: tokyonight

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
